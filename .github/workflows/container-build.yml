name: Build container architecture

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      runner:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    outputs:
      image:
        description: Canonical GHCR image name
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Built image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test with media converters
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/${{ inputs.architecture }}
          push: false
          cache-from: type=gha,scope=tests-${{ inputs.architecture }}
          cache-to: type=gha,mode=max,scope=tests-${{ inputs.architecture }}

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ inputs.architecture }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push by digest so parallel builds cannot overwrite the shared tags.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ inputs.publish }}
          cache-from: |
            type=gha,scope=image-${{ inputs.architecture }}
            type=gha,scope=tests-${{ inputs.architecture }}
          cache-to: type=gha,mode=max,scope=image-${{ inputs.architecture }}
