name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  amd64:
    name: AMD64
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      architecture: amd64
      runner: ubuntu-24.04
      publish: ${{ github.event_name != 'pull_request' }}

  arm64:
    name: ARM64
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      architecture: arm64
      runner: ubuntu-24.04-arm
      publish: ${{ github.event_name != 'pull_request' }}

  publish:
    name: Publish multi-platform tags
    needs: [amd64, arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.amd64.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=sha,format=long

      - name: Combine architecture images
        env:
          IMAGE: ${{ needs.amd64.outputs.image }}
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"

      - name: Inspect published image
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$METADATA")"
